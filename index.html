<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymMemory - Diario & Aiuto Memoria Palestra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    .fade-in { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-extrabold text-lg">
          GM
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight text-white">GymMemory</h1>
          <p class="text-xs text-slate-400">Progressi & Aiuto Memoria</p>
        </div>
      </div>
      <button onclick="toggleModal('bagModal')" class="relative flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-medium text-slate-200 transition">
        <span>🎒 Borsa</span>
        <span id="bagBadge" class="bg-emerald-500 text-slate-950 font-bold px-1.5 py-0.2 rounded-full text-[10px]">0/5</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-xl mx-auto px-4 pt-4">

    <!-- SELETTORE SCHEDE -->
    <div class="flex items-center gap-2 mb-4 overflow-x-auto pb-1">
      <button onclick="selectDay('A')" id="tab-A" class="day-tab flex-1 py-2.5 px-3 rounded-xl font-semibold text-sm transition border text-center">
        Lunedì
        <span class="block text-[11px] font-normal opacity-80">Petto & Spinta</span>
      </button>
      <button onclick="selectDay('B')" id="tab-B" class="day-tab flex-1 py-2.5 px-3 rounded-xl font-semibold text-sm transition border text-center">
        Martedì
        <span class="block text-[11px] font-normal opacity-80">Dorso & Tirata</span>
      </button>
      <button onclick="selectDay('C')" id="tab-C" class="day-tab flex-1 py-2.5 px-3 rounded-xl font-semibold text-sm transition border text-center">
        Mercoledì
        <span class="block text-[11px] font-normal opacity-80">Gambe & Core</span>
      </button>
    </div>

    <!-- BARRA STATO RAPIDO -->
    <div class="bg-slate-800/70 border border-slate-700/80 rounded-2xl p-3.5 mb-5 flex items-center justify-between">
      <div>
        <p class="text-xs text-slate-400">Ultimo allenamento salvato</p>
        <p id="lastSessionText" class="text-sm font-semibold text-slate-200 mt-0.5">Nessuno registrato</p>
      </div>
      <button onclick="toggleModal('historyModal')" class="text-xs font-semibold text-emerald-400 hover:text-emerald-300 bg-emerald-500/10 border border-emerald-500/30 px-3 py-2 rounded-xl transition">
        📊 Storico
      </button>
    </div>

    <!-- LISTA ESERCIZI -->
    <div id="exercisesList" class="space-y-4"></div>

    <!-- AGGIUNGI ESERCIZIO -->
    <button onclick="toggleModal('addExerciseModal')" class="mt-5 w-full py-3 rounded-2xl border-2 border-dashed border-slate-700 hover:border-emerald-500/60 text-slate-400 hover:text-emerald-400 text-sm font-semibold transition flex items-center justify-center gap-2">
      <span>+
